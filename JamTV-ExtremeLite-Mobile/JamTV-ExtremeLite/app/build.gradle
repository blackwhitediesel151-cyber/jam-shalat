plugins { id 'com.android.application' }

android {
    namespace 'id.blackwhite.jamtv'
    compileSdk 35
    defaultConfig {
        applicationId 'id.blackwhite.jamtv'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0-extreme-lite'
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
}
